name: Vektor Main Build Workflow V1

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    

jobs:
  build:

    runs-on: macos-latest

    steps:
      # Clone Github Repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Dependencies
      - name: Install dependencies
        run: |
          brew update
          brew install googletest nlohmann-json
          

      # Build Target and run unit tests
      - name: Build library
        run: make lib

      - name: Build unit tests
        run: make -C unittests ut

      - name: Run unit tests
        run: make -C unittests ut-run